name: Telegram bot reliability tests

on:
  pull_request:
    paths:
      - 'bot/**'
      - '.github/workflows/telegram-bot-coordinator.yml'
      - 'shared/**'
  push:
    branches:
      - 'reliability/**'
    paths:
      - 'bot/**'
      - '.github/workflows/telegram-bot-coordinator.yml'
      - 'shared/**'

jobs:
  bot:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bot/package-lock.json
      # The full integration suite requires a private, isolated .env.test database.
      # Never replace that safety guard with production credentials in CI.
      - run: npm install --no-audit --no-fund
      - run: npx vitest run --config vitest.coordinator.config.mts
      - run: npx tsc --noEmit --target ES2022 --module NodeNext --moduleResolution NodeNext --skipLibCheck src/index.ts
